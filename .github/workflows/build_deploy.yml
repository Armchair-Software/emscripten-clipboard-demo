name: build_and_deploy
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUILD_TYPE: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.check.outcome == 'success' && steps.check.outputs.should_skip == 'true' }}
    steps:
    - name: Check for a successful duplicate
      id: check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      # An API failure must fall back to running CI.
      continue-on-error: true
      with:
        # Only reuse completed successes; a running build could still fail or be cancelled.
        concurrent_skipping: 'never'
        skip_after_successful_duplicate: 'true'
        cancel_others: 'false'
        # Pushes must still produce artifacts for deployment/release jobs.
        do_not_skip: '["workflow_dispatch","schedule","merge_group","release","push"]'

  build:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk
      
    steps:
    - uses: actions/checkout@v3
    - run: ls -alh
    - run: mkdir build
    - run: cd build && emcmake cmake ..
    - run: cd build && emmake make -j$(nproc)
    - run: ls -alh build/
    - run: mkdir deploy
    - run: mv build/client.* deploy/
    - run: mv deploy/client.html deploy/index.html
    - run: ls -alh deploy/
    - uses: actions/upload-artifact@v4
      with:
        name: page
        path: deploy
        if-no-files-found: error
    
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
      
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: page
        path: .
    - run: ls -alh
    - uses: actions/configure-pages@v5
    - run: ls -alh
    - uses: actions/upload-pages-artifact@v3
      with:
        path: .
    - id: deployment
      uses: actions/deploy-pages@v4
